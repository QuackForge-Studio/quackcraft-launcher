name: Setup Dependencies
description: Install and setup dependencies for building QuackCraft Launcher

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
  msystem:
    description: MSYS2 subsystem to use
    required: false
  vcvars-arch:
    description: Visual Studio architecture to use
    required: false
  qt-version:
    description: Version of Qt to use
    required: true

outputs:
  build-type:
    description: Type of build used
    value: ${{ inputs.build-type }}
  qt-version:
    description: Version of Qt used
    value: ${{ inputs.qt-version }}

runs:
  using: composite

  steps:
    - name: Setup Linux dependencies
      if: ${{ runner.os == 'Linux' }}
      uses: ./.github/actions/setup-dependencies/linux

    - name: Setup macOS dependencies
      if: ${{ runner.os == 'macOS' }}
      uses: ./.github/actions/setup-dependencies/macos
      with:
        build-type: ${{ inputs.build-type }}

    - name: Setup Windows dependencies
      if: ${{ runner.os == 'Windows' }}
      uses: ./.github/actions/setup-dependencies/windows
      with:
        build-type: ${{ inputs.build-type }}
        msystem: ${{ inputs.msystem }}
        vcvars-arch: ${{ inputs.vcvars-arch }}

    # Determine the vcpkg triplet for this platform/arch
    - name: Determine vcpkg triplet
      shell: bash
      run: |
        declare vcpkg_arch vcpkg_platform
        case "$RUNNER_ARCH" in
          "X64")  vcpkg_arch=x64 ;;
          "ARM64") vcpkg_arch=arm64 ;;
          *)
            echo "# Unsupported architecture $RUNNER_ARCH" >> "$GITHUB_STEP_SUMMARY"
            exit 1 ;;
        esac
        case "$RUNNER_OS" in
          "Linux")  vcpkg_platform=linux ;;
          "macOS")  vcpkg_arch=universal; vcpkg_platform=osx ;;
          "Windows")
            if [ "${{ inputs.msystem }}" != "" ]; then
              vcpkg_platform=mingw-static
            else
              vcpkg_platform=windows
            fi ;;
          *)
            echo "# Unsupported OS $RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
            exit 1 ;;
        esac
        echo "VCPKG_TRIPLET=$vcpkg_arch-$vcpkg_platform" >> "$GITHUB_ENV"

    # MinGW gets Qt from MSYS2; other platforms use install-qt-action
    - name: Install Qt
      if: ${{ inputs.msystem == '' }}
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: "==3.1.*"
        version: ${{ inputs.qt-version }}
        modules: qtimageformats qtnetworkauth
        cache: ${{ inputs.build-type == 'Debug' }}
