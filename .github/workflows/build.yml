name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            preset: linux
            qt: '6.10'
          - name: macOS
            os: macos-14
            preset: macos
            qt: '6.10'
          - name: Windows-MinGW
            os: windows-2022
            preset: windows_mingw
            qt: '6.10'
          - name: Windows-MSVC
            os: windows-2022
            preset: windows_msvc
            qt: '6.10'

    env:
      ARTIFACT_NAME: ${{ matrix.name }}-QuackCraft
      BUILD_PLATFORM: ci
      CMAKE_PRESET: ${{ matrix.preset }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config \
            curl zip unzip tar \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja nasm

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: ${{ runner.os == 'macOS' && 'mac' || runner.os == 'Windows' && 'windows' || 'linux' }}
          target: desktop
          arch: ${{ runner.arch }}
          modules: 'qtshadertools'
          cache: true

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        run: |
          cd cmake/vcpkg
          if [ "$RUNNER_OS" = "Linux" ] || [ "$RUNNER_OS" = "macOS" ]; then
            ./bootstrap-vcpkg.sh
          else
            cmd.exe /c "bootstrap-vcpkg.bat" 2>/dev/null || ./bootstrap-vcpkg.sh
          fi
          cd ../..

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          cd cmake/vcpkg
          cmd.exe /c "bootstrap-vcpkg.bat" 2>&1 || powershell.exe -ExecutionPolicy Bypass -File bootstrap-vcpkg.ps1
          cd ../..

      - name: Configure
        run: |
          cmake --preset "$CMAKE_PRESET" \
            -D CMAKE_PREFIX_PATH="${Qt6_DIR}" \
            -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" \
            -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"

      - name: Build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config Release

      - name: Run tests
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config Release --output-on-failure
        continue-on-error: true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: quackcraft-${{ matrix.name }}
          path: |
            build/quackcraftlauncher*
            build/*.exe
            build/QuackCraftLauncher*
          if-no-files-found: warn
          retention-days: 7
