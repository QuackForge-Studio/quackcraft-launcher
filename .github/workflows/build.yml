name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            preset: linux
            msystem: ''
            vcvars-arch: ''
            qt-version: '6.10.2'
          - name: macOS
            os: macos-14
            preset: macos
            msystem: ''
            vcvars-arch: ''
            qt-version: '6.10.2'
          - name: Windows-MinGW
            os: windows-2022
            preset: windows_mingw
            msystem: CLANG64
            vcvars-arch: amd64_x86
            qt-version: '6.10.2'
          - name: Windows-MSVC
            os: windows-2022
            preset: windows_msvc
            msystem: ''
            vcvars-arch: amd64
            qt-version: '6.10.2'

    runs-on: ${{ matrix.os }}

    env:
      ARTIFACT_NAME: ${{ matrix.name }}-QuackCraft
      BUILD_PLATFORM: ci
      CMAKE_PRESET: ${{ matrix.preset }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && format('msys2 {0}', matrix.msystem) || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: ${{ matrix.name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      - name: Fetch libnbtplusplus
        shell: bash
        run: |
          if [ ! -d libraries/libnbtplusplus/.git ]; then
            git clone --depth 1 https://github.com/PrismLauncher/libnbtplusplus.git libraries/libnbtplusplus
          fi

      - name: Bootstrap vcpkg (non-MinGW)
        if: matrix.msystem == ''
        shell: bash
        run: |
          if [ ! -d cmake/vcpkg/.git ]; then
            mkdir -p cmake/vcpkg
            cd cmake/vcpkg
            git init -q
            git remote add origin https://github.com/microsoft/vcpkg.git
            git fetch --depth 1 origin 2d6a6cf3ac9a7cc93942c3d289a2f9c661a6f4a7
            git checkout -q FETCH_HEAD
            cd ../..
          fi
          if command -v vcpkg >/dev/null 2>&1; then
            echo "vcpkg on PATH: $(vcpkg version | head -1)"
          elif [ -n "$VCPKG_INSTALLATION_ROOT" ] && [ -x "$VCPKG_INSTALLATION_ROOT/vcpkg" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
            echo "$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_PATH"
          else
            echo "::warning::vcpkg not pre-installed; bootstrapping portable copy"
            cd cmake/vcpkg
            if [ "$RUNNER_OS" = "Windows" ]; then
              cmd.exe /c "bootstrap-vcpkg.bat -disableMetrics" 2>&1 | tail -5
            else
              ./bootstrap-vcpkg.sh -disableMetrics 2>&1 | tail -5
            fi
            echo "VCPKG_ROOT=$(pwd)" >> "$GITHUB_ENV"
            echo "$(pwd)" >> "$GITHUB_PATH"
            cd ../..
          fi

      - name: Configure
        env:
          VCPKG_TRIPLET_ECHO: ${{ env.VCPKG_TRIPLET }}
        run: |
          echo "=== Environment diagnostics ==="
          echo "CMAKE_PRESET=$CMAKE_PRESET"
          echo "VCPKG_TRIPLET=$VCPKG_TRIPLET"
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          echo "VCPKG_HOST_TRIPLET=$VCPKG_HOST_TRIPLET"
          echo "VCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET"
          echo "Qt6_DIR=$Qt6_DIR"
          which cmake && cmake --version | head -1
          which vcpkg 2>/dev/null && vcpkg version 2>/dev/null | head -2 || echo "vcpkg not on PATH"
          which ninja && ninja --version
          echo "=== Real configure (exit code surfaces in build status) ==="
          cmake --preset "$CMAKE_PRESET" \
            -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" \
            -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"

      - name: Build
        run: |
          echo "=== Build directory ==="
          ls -la build/ 2>/dev/null || echo "no build/ dir"
          echo "=== CMAKE_PRESET=$CMAKE_PRESET ==="
          echo "=== Running cmake --build --preset $CMAKE_PRESET ==="
          cmake --build --preset "$CMAKE_PRESET" 2>&1 | tail -100

      - name: Run tests
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config Release --output-on-failure
        continue-on-error: true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: quackcraft-${{ matrix.name }}
          path: |
            build/quackcraftlauncher*
            build/*.exe
            build/QuackCraftLauncher*
          if-no-files-found: warn
          retention-days: 7
